# ---------------------------------------------------------------------------
# coturn configuration for VoiceMeet
#
#   sudo apt install coturn
#   sudo cp turnserver.conf /etc/turnserver.conf
#   sudo systemctl enable --now coturn
#
# Then set on Vercel:
#   TURN_URLS=turn:turn.example.com:3478,turns:turn.example.com:5349
#   TURN_STATIC_AUTH_SECRET=<the same secret as below>
# ---------------------------------------------------------------------------

listening-port=3478
tls-listening-port=5349

# Public IP of this host. On a cloud VM behind a NAT, also set external-ip=PUBLIC/PRIVATE.
listening-ip=0.0.0.0
# external-ip=203.0.113.10

realm=turn.example.com
server-name=turn.example.com

# Time-limited credentials, matching /api/turn-credentials. The app derives
# username `<expiry>:voicemeet` and password base64(HMAC-SHA1(username, secret)).
use-auth-secret
static-auth-secret=REPLACE_WITH_A_LONG_RANDOM_SECRET

# TLS — strongly recommended so TURN survives restrictive corporate firewalls.
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

fingerprint
no-cli
no-multicast-peers

# Relay only what a voice call needs.
no-tcp-relay
min-port=49160
max-port=49200

# Block relaying to internal networks (SSRF protection).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

user-quota=12
total-quota=1200
