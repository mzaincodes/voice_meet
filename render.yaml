# Deploys the VoiceMeet signaling server to Render.
# The Next.js app itself goes to Vercel — Vercel cannot host Socket.IO.
services:
  - type: web
    name: voicemeet-signal
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run signal
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # NOTE: do NOT set PORT here. Render injects its own PORT and expects the
      # service to bind to it; the server reads process.env.PORT automatically.
      # Overriding it makes Render report "no open ports detected".
      #
      # Your Vercel production domain(s), comma-separated. Set in the dashboard.
      - key: CORS_ORIGIN
        sync: false
      # Set true to also accept *.vercel.app preview deployments.
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
